  <script type="text/javascript">
    window.onload = function() {
      function imgloader2(){
        console.log("Loading custom-src-2 images...");
      var images =
      document.getElementsByTagName('img');
      var target = 0;
      var loaded = 0;
      for (var i = 0; i < images.length; i++){
        if (images[i].getAttribute('custom-src-2')) {
          target++;
        }
      }
      console.log("defined target value")
       if (target === 0) {
        console.log("Custom-src-2 images loaded!");
      } else {
        for (var i = 0; i < images.length; i++){
          if (images[i].getAttribute('custom-src-2')){
            images[i].onload = function(){
              loaded++;
              console.log("loaded an image")
              if (loaded === target) {
                    console.log("Custom-src-2 images loaded!");
                    
              }
            }
            images[i].src = images[i].getAttribute('custom-src-2');
